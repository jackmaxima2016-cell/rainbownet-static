name: Deploy blog.rainbownet.ch

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wp-update]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Sans cette variable, le build publie un site muet : ni balise GA4, ni bandeau
          # de consentement (le layout conditionne tout le bloc à PUBLIC_GA4_ID).
          PUBLIC_GA4_ID: ${{ secrets.GA4_ID }}

      - name: SEO contract (bloquant)
        run: |
          python3 scripts/seo_contract.py data/audit_rainbownet.json dist --posts data/wp/posts.json

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name rainbownet --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
